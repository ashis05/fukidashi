<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Fukidashi</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark">Fukidashi</h1>
    <span class="kana" lang="ja">吹き出し</span>
  </header>

  <main class="panel">
    <div class="field">
      <label for="language">Source language</label>
      <select id="language">
        <option value="ja">Japanese (manga)</option>
        <option value="ko">Korean (manhwa)</option>
        <option value="zh">Chinese (manhua)</option>
        <option value="es">Spanish</option>
      </select>
      <p class="hint">Korean, Chinese and Spanish need the optional OCR pack on your server.</p>
    </div>

    <button type="button" id="translate" class="btn-primary">
      <span class="spinner" aria-hidden="true"></span>
      <span id="translate-label">Translate page</span>
    </button>

    <div class="row">
      <input type="checkbox" id="auto" class="toggle-input">
      <label for="auto" class="toggle">
        <span class="track" aria-hidden="true"></span>
        <span>Auto-translate this tab</span>
      </label>
    </div>

    <button type="button" id="overlay" class="btn-secondary" disabled>Hide translation</button>

    <details class="server" id="server">
      <summary>Server</summary>
      <div class="server-body">
        <label for="server-url">Server URL</label>
        <input type="url" id="server-url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8000">
        <div class="server-actions">
          <button type="button" id="save" class="btn-secondary">Save</button>
          <button type="button" id="test" class="btn-secondary">Test connection</button>
        </div>
        <p class="server-status"><span id="dot" class="dot" data-state="idle"></span><span id="server-msg">Not tested</span></p>
      </div>
    </details>
  </main>

  <p id="status" class="status" role="status" aria-live="polite" data-kind="info">Ready</p>
  <script src="popup.js"></script>
</body>
</html>
