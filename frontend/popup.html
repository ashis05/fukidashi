<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 220px; padding: 15px; font-family: sans-serif; text-align: center; background: #f4f4f4; }
        .btn {
            background-color: #4CAF50; color: white; border: none;
            padding: 10px; font-size: 16px; cursor: pointer; border-radius: 5px;
            width: 100%; margin-bottom: 10px; font-weight: bold;
        }
        .btn:hover { background-color: #45a049; }

        .switch-container { display: flex; align-items: center; justify-content: center; margin-top: 10px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; margin-right: 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* New Language Dropdown Style */
        select {
            width: 100%; padding: 8px; margin-bottom: 15px;
            border-radius: 5px; border: 1px solid #ccc;
        }

        #status { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
<h3>Manga Translator</h3>

<label for="languageSelect" style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; text-align: left;">Source Language:</label>
<select id="languageSelect">
    <option value="ja">Japanese (Default)</option>
</select>

<button id="translateBtn" class="btn">Translate Page</button>

<div class="switch-container">
    <label class="switch">
        <input type="checkbox" id="autoToggle">
        <span class="slider"></span>
    </label>
    <span>Auto-Translate</span>
</div>

<div id="status">Ready</div>
<script src="popup.js"></script>
</body>
</html>
